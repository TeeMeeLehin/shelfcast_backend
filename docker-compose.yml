version: '3.8'

services:
  api:
    build: .
    container_name: shelfcast_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shelfcast_redis
    ports:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  celery:
    image: shelfcast_api
    container_name: shelfcast_celery
    command: celery -A tasks.ingestion_tasks.celery_app worker -l info -B
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
