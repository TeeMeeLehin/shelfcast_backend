version: '3.8'

services:
  api:
    build: .
    container_name: shelfcast_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shelfcast_redis
    ports:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: shelfcast_celery_worker
    command: celery -A tasks.ingestion_tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: shelfcast_celery_beat
    command: celery -A tasks.ingestion_tasks beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
